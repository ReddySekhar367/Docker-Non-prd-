```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineBook - Movie Ticket Booking</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #08090d;
    --card: #11131a;
    --card2: #181b24;
    --text: #ffffff;
    --muted: #9ca3af;
    --primary: #e50914;
    --primary-dark: #b20710;
    --gold: #f5c518;
    --green: #22c55e;
    --border: #292d38;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
}

/* ================= HEADER ================= */

header {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: rgba(8, 9, 13, 0.96);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
}

.navbar {
    max-width: 1250px;
    margin: auto;
    padding: 18px 25px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.logo {
    font-size: 26px;
    font-weight: 900;
    color: var(--primary);
    white-space: nowrap;
}

.logo span {
    color: white;
}

nav {
    display: flex;
    gap: 25px;
}

nav a {
    color: #ddd;
    text-decoration: none;
    font-size: 14px;
    transition: 0.3s;
}

nav a:hover {
    color: white;
}

.header-buttons {
    display: flex;
    align-items: center;
    gap: 10px;
}

.search-small {
    background: #151820;
    border: 1px solid var(--border);
    color: white;
    padding: 10px 14px;
    border-radius: 20px;
    width: 180px;
    outline: none;
}

.login-btn {
    border: 1px solid #444;
    background: transparent;
    color: white;
    padding: 10px 16px;
    border-radius: 20px;
    cursor: pointer;
}

.login-btn:hover {
    background: white;
    color: black;
}

/* ================= HERO ================= */

.hero {
    min-height: 570px;
    display: flex;
    align-items: center;
    position: relative;
    overflow: hidden;
    background:
        linear-gradient(90deg, #08090d 15%, rgba(8,9,13,.78) 45%, rgba(8,9,13,.25)),
        linear-gradient(0deg, #08090d, transparent 30%),
        url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1800&q=85")
        center/cover;
}

.hero-content {
    max-width: 1250px;
    width: 100%;
    margin: auto;
    padding: 60px 25px;
}

.hero-badge {
    display: inline-block;
    background: var(--primary);
    padding: 7px 13px;
    border-radius: 5px;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 18px;
}

.hero h1 {
    font-size: clamp(42px, 7vw, 80px);
    max-width: 700px;
    line-height: 0.98;
    margin-bottom: 20px;
}

.hero p {
    max-width: 600px;
    color: #d1d5db;
    font-size: 17px;
    line-height: 1.7;
    margin-bottom: 28px;
}

.hero-buttons {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.btn {
    padding: 14px 23px;
    border-radius: 7px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    font-size: 15px;
}

.btn-primary {
    background: var(--primary);
    color: white;
}

.btn-primary:hover {
    background: var(--primary-dark);
}

.btn-secondary {
    background: white;
    color: black;
}

/* ================= MAIN ================= */

.container {
    max-width: 1250px;
    margin: auto;
    padding: 60px 25px;
}

.section-title {
    font-size: 30px;
    margin-bottom: 8px;
}

.section-subtitle {
    color: var(--muted);
    margin-bottom: 25px;
}

/* ================= SEARCH ================= */

.search-box {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    padding: 17px 20px;
    color: white;
    border-radius: 10px;
    outline: none;
    font-size: 16px;
    margin-bottom: 35px;
}

.search-box:focus {
    border-color: var(--primary);
}

/* ================= MOVIES ================= */

.movie-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 18px;
}

.movie-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    transition: 0.3s;
    cursor: pointer;
}

.movie-card:hover {
    transform: translateY(-7px);
    border-color: #555;
}

.poster {
    height: 280px;
    overflow: hidden;
    position: relative;
}

.poster img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: 0.4s;
}

.movie-card:hover img {
    transform: scale(1.06);
}

.rating {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(0,0,0,.8);
    padding: 6px 8px;
    border-radius: 5px;
    color: var(--gold);
    font-size: 12px;
    font-weight: bold;
}

.movie-info {
    padding: 13px;
}

.movie-info h3 {
    font-size: 15px;
    margin-bottom: 7px;
}

.movie-meta {
    color: var(--muted);
    font-size: 12px;
}

.movie-price {
    color: var(--green);
    font-size: 12px;
    margin-top: 8px;
}

/* ================= BOOKING ================= */

.booking-area {
    background: #0d0f15;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
}

.booking-grid {
    display: grid;
    grid-template-columns: 1fr 1.5fr;
    gap: 35px;
}

.booking-panel,
.seat-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 25px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    color: #d1d5db;
    font-size: 14px;
}

select {
    width: 100%;
    background: #08090d;
    color: white;
    border: 1px solid var(--border);
    padding: 13px;
    border-radius: 7px;
    outline: none;
}

.screen {
    height: 8px;
    background: white;
    border-radius: 100%;
    margin: 20px auto 35px;
    max-width: 500px;
    box-shadow: 0 0 25px rgba(255,255,255,.4);
}

.screen-label {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: -25px;
    margin-bottom: 30px;
}

.seat-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
}

.seat-row {
    display: flex;
    gap: 7px;
}

.seat {
    width: 31px;
    height: 28px;
    border: 1px solid #4b5563;
    border-radius: 6px 6px 3px 3px;
    background: #151922;
    color: #aaa;
    font-size: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

.seat:hover {
    border-color: white;
}

.seat.selected {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
}

.seat.booked {
    background: #3a3d46;
    color: #777;
    cursor: not-allowed;
}

.legend {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin: 30px 0;
    font-size: 12px;
    color: var(--muted);
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
}

.legend-box {
    width: 16px;
    height: 16px;
    border-radius: 4px;
    background: #151922;
    border: 1px solid #4b5563;
}

.legend-box.selected {
    background: var(--primary);
    border-color: var(--primary);
}

.legend-box.booked {
    background: #3a3d46;
}

.booking-summary {
    margin-top: 20px;
    border-top: 1px solid var(--border);
    padding-top: 20px;
}

.summary-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    color: #bbb;
}

.summary-total {
    font-size: 22px;
    font-weight: bold;
    color: white;
}

.book-btn {
    width: 100%;
    margin-top: 15px;
    padding: 15px;
    background: var(--primary);
    border: none;
    color: white;
    border-radius: 7px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.book-btn:hover {
    background: var(--primary-dark);
}

/* ================= BOOKINGS ================= */

.booking-list {
    display: grid;
    gap: 15px;
}

.booking-card {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 20px;
    border-radius: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
}

.booking-card h3 {
    margin-bottom: 7px;
}

.booking-card p {
    color: var(--muted);
    font-size: 13px;
    margin: 4px 0;
}

.booking-id {
    color: var(--green);
    font-size: 12px;
}

.empty-bookings {
    color: var(--muted);
    padding: 30px;
    text-align: center;
    border: 1px dashed var(--border);
    border-radius: 10px;
}

/* ================= MODAL ================= */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.78);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    padding: 20px;
}

.modal.active {
    display: flex;
}

.modal-content {
    width: 100%;
    max-width: 650px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    position: relative;
    max-height: 90vh;
    overflow-y: auto;
}

.close {
    position: absolute;
    right: 20px;
    top: 15px;
    font-size: 28px;
    color: #aaa;
    cursor: pointer;
}

.close:hover {
    color: white;
}

.modal-movie {
    display: flex;
    gap: 25px;
}

.modal-movie img {
    width: 190px;
    height: 280px;
    object-fit: cover;
    border-radius: 8px;
}

.modal-details h2 {
    font-size: 30px;
    margin-bottom: 12px;
}

.modal-details p {
    color: #bbb;
    line-height: 1.7;
    margin-bottom: 15px;
}

.tags {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-bottom: 20px;
}

.tag {
    background: #252934;
    padding: 6px 10px;
    border-radius: 15px;
    font-size: 11px;
}
